# ScienceWorld Training Configuration with WMC-ERC Dynamic Entropy Clipping
# Use with: python sciworld_rl.py --config-name sciworld_wmc_erc_param

# Project settings
project_name: co-evolve
experiment_name: sciworld_wmc_erc

# Logging
logger_backends: ["console", "wandb"]

# Tracing (optional)
enable_tracing: true
weave_project: null

# WandB (optional)
wandb_key: null

# Model and tokenizer
tokenizer_path: null

# Training parameters
batch_size: 4
num_workers: 0 # Keep single-process; ScienceWorld uses per-instance JVM ports
num_epochs: null
num_steps: 1000
save_freq: 200
test_freq: 50

# Validation parameters
val_batch_size: 32

# Generation parameters
temperature: 1
top_p: 1
max_new_tokens: 4096
max_prompt_tokens: 2048

# Algorithm (must be agent_loop for multi-turn)
algorithm: "agent_loop"

# RL Algorithm settings
adv_estimator: "grpo"
rollout_n: 8

# WMC-ERC: Dynamic Entropy Clipping
wmc_erc:
  enable: true
  mu_base: 1.0
  lambda_wm: 10.0
  entropy_floor: 0.1
  entropy_target: 2.0
  base_entropy_coeff: 0.02

# Disable fixed entropy_coeff since adaptive beta_token handles it
entropy_coeff: 0.0

interaction:
  name: sciworld
  class_path: opentinker.environment.gym_environment_interaction.GymEnvironmentInteraction
  config:
    env_host: 0.0.0.0
    env_port: 8092
    env_endpoint: http://${interaction.config.env_host}:${interaction.config.env_port}
    env_shards: 8
    max_steps: 30
    max_total_steps: 30
    observation_template: "{observation}"
    split: train # train, dev, test
    task_names: null # e.g. ["boil", "find-animal"]
    task_ids: null
    variation_indices: null
    simplification_str: ""
    jar_path: null
    local_thread_base: 20000

multi_turn:
  max_user_turns: ${interaction.config.max_total_steps}
  max_assistant_turns: ${interaction.config.max_total_steps}
  max_tokens_per_turn: 512
  weave_project: null
  experiment_name: "sciworld_wmc_erc"

scheduler_url: "http://0.0.0.0:8780"
scheduler_api_key: null

num_gpus: 8
